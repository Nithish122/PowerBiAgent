report:
  canvas:
    width: 1280
    height: 720
  theme: default

pages:
  - name: Executive Overview
    type: executive
    persona: Executive Leadership
    question: What is the public sentiment toward our brand and AI-related topics?
    reqs: [REQ-002, REQ-003, REQ-004, REQ-005, REQ-006, REQ-007, REQ-008]
    visuals:
      - id: KPI_PostCount
        type: card
        title: Post Count
        position: { x: 24, y: 132, width: 280, height: 110 }
        fields:
          values: ["[Post Count]"]
        altText: "Total social posts in the selected period."
      - id: KPI_NetSentiment
        type: card
        title: Net Sentiment Score
        position: { x: 336, y: 132, width: 280, height: 110 }
        fields:
          values: ["[Net Sentiment Score]"]
        altText: "Net sentiment score for the selected period."
      - id: KPI_TotalEngagement
        type: card
        title: Total Engagement
        position: { x: 648, y: 132, width: 280, height: 110 }
        fields:
          values: ["[Total Engagement]"]
        altText: "Total engagement across selected posts."
      - id: KPI_AudienceReach
        type: card
        title: Audience Reach
        position: { x: 960, y: 132, width: 280, height: 110 }
        fields:
          values: ["[Audience Reach]"]
        altText: "Combined audience reach for the selected period."
      - id: CHT_SentimentTrend
        type: lineChart
        title: Net Sentiment Trend
        position: { x: 24, y: 258, width: 816, height: 250 }
        fields:
          values: ["[Net Sentiment Score]"]
          category: ["DimDate[Date]"]
        altText: "Weekly net sentiment over the selected date range."
      - id: CHT_PlatformEngagement
        type: clusteredBarChart
        title: Engagement by Platform
        position: { x: 856, y: 258, width: 400, height: 250 }
        fields:
          values: ["[Total Engagement]"]
          category: ["DimPlatform[PlatformName]"]
        altText: "Total engagement by platform."
      - id: TBL_TopNegativeTopics
        type: tableEx
        title: Top Negative Topics
        position: { x: 24, y: 524, width: 616, height: 172 }
        fields:
          values: ["[Topic Net Sentiment]", "[Post Count]"]
          category: ["DimTopic[TopicName]"]
        altText: "Topics ranked by negative sentiment and post volume."
      - id: TBL_RiskSummary
        type: tableEx
        title: High-Risk Summary
        position: { x: 656, y: 524, width: 600, height: 172 }
        fields:
          values: ["[High-Risk Content Count]", "[Audience Reach]"]
          category: ["DimTopic[TopicName]"]
        altText: "High-risk content counts and audience reach by topic."
      - id: SLR_Date
        type: slicer
        title: Date
        position: { x: 24, y: 72, width: 280, height: 48 }
        fields:
          values: ["DimDate[Date]"]
        altText: "Use this slicer to filter the report by date."
      - id: SLR_Platform
        type: slicer
        title: Platform
        position: { x: 324, y: 72, width: 220, height: 48 }
        fields:
          values: ["DimPlatform[PlatformName]"]
        altText: "Filter the report by platform."
      - id: SLR_Topic
        type: slicer
        title: Topic
        position: { x: 564, y: 72, width: 220, height: 48 }
        fields:
          values: ["DimTopic[TopicName]"]
        altText: "Filter the report by topic."
      - id: SLR_Location
        type: slicer
        title: Location
        position: { x: 804, y: 72, width: 220, height: 48 }
        fields:
          values: ["DimLocation[CountryName]"]
        altText: "Filter the report by location."

  - name: Sentiment Intelligence
    type: analysis
    persona: Brand Management
    question: Is overall sentiment improving or deteriorating over time?
    reqs: [REQ-002, REQ-003, REQ-004, REQ-008]
    visuals:
      - id: KPI_PositiveShare
        type: card
        title: Positive Sentiment Share
        position: { x: 24, y: 132, width: 280, height: 110 }
        fields:
          values: ["[Positive Sentiment Share]"]
        altText: "Share of posts with positive sentiment."
      - id: KPI_NeutralShare
        type: card
        title: Neutral Sentiment Share
        position: { x: 336, y: 132, width: 280, height: 110 }
        fields:
          values: ["[Neutral Sentiment Share]"]
        altText: "Share of posts with neutral sentiment."
      - id: KPI_NegativeShare
        type: card
        title: Negative Sentiment Share
        position: { x: 648, y: 132, width: 280, height: 110 }
        fields:
          values: ["[Negative Sentiment Share]"]
        altText: "Share of posts with negative sentiment."
      - id: KPI_SentimentChange
        type: card
        title: Sentiment Change vs Prior Period
        position: { x: 960, y: 132, width: 280, height: 110 }
        fields:
          values: ["[Sentiment Change vs Prior Period]"]
        altText: "Difference between current and prior-period net sentiment."
      - id: CHT_RollingSentiment
        type: lineChart
        title: Rolling 30-Day Net Sentiment
        position: { x: 24, y: 258, width: 816, height: 250 }
        fields:
          values: ["[Rolling 30-Day Net Sentiment]"]
          category: ["DimDate[Date]"]
        altText: "30-day rolling net sentiment trend."
      - id: CHT_SentimentMix
        type: lineClusteredColumnComboChart
        title: Sentiment Mix by Month
        position: { x: 856, y: 258, width: 400, height: 250 }
        fields:
          values: ["[Positive Sentiment Share]", "[Negative Sentiment Share]", "[Neutral Sentiment Share]"]
          category: ["DimDate[YearMonth]"]
        altText: "Monthly mix of positive, neutral, and negative sentiment."
      - id: TBL_TopicNetSentiment
        type: tableEx
        title: Topic Net Sentiment
        position: { x: 24, y: 524, width: 616, height: 172 }
        fields:
          values: ["[Topic Net Sentiment]", "[Post Count]"]
          category: ["DimTopic[TopicName]"]
        altText: "Net sentiment by topic for the selected time window."
      - id: CHT_PlatformMatrix
        type: clusteredBarChart
        title: Sentiment by Platform
        position: { x: 656, y: 524, width: 600, height: 172 }
        fields:
          values: ["[Net Sentiment Score]"]
          category: ["DimPlatform[PlatformName]"]
        altText: "Net sentiment score by platform."
      - id: SLR_Date
        type: slicer
        title: Date
        position: { x: 24, y: 72, width: 220, height: 48 }
        fields:
          values: ["DimDate[Date]"]
        altText: "Use this slicer to filter sentiment analysis by date."
      - id: SLR_Platform
        type: slicer
        title: Platform
        position: { x: 264, y: 72, width: 180, height: 48 }
        fields:
          values: ["DimPlatform[PlatformName]"]
        altText: "Filter the analysis by social platform."
      - id: SLR_Topic
        type: slicer
        title: Topic
        position: { x: 464, y: 72, width: 180, height: 48 }
        fields:
          values: ["DimTopic[TopicName]"]
        altText: "Filter the analysis by topic."
      - id: SLR_Location
        type: slicer
        title: Location
        position: { x: 664, y: 72, width: 180, height: 48 }
        fields:
          values: ["DimLocation[CountryName]"]
        altText: "Filter the analysis by location."
      - id: SLR_Sentiment
        type: slicer
        title: Sentiment
        position: { x: 864, y: 72, width: 180, height: 48 }
        fields:
          values: ["DimSentiment[SentimentLabel]"]
        altText: "Filter the analysis by sentiment label."
      - id: SLR_Language
        type: slicer
        title: Language
        position: { x: 1064, y: 72, width: 180, height: 48 }
        fields:
          values: ["DimLanguage[LanguageName]"]
        altText: "Filter the analysis by language."
